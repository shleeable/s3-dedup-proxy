name: build-and-release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build and create a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout code # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup sbt # https://github.com/sbt/setup-sbt
        uses: sbt/setup-sbt@508b753e53cb6095967669e0911487d2b9bc9f41 # v1.1.22 Pin due to https://github.com/sbt/setup-sbt/issues/84

      - name: Setup Java (temurin@8) # https://github.com/actions/setup-java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Set TAG variables
        id: tags_variables
        run: |
          set -x

          TAG_CURRENT=$(git describe --abbrev=0 --tags ${{ github.ref }})
          TAG_PREVIOUS=$(git describe --abbrev=0 --tags $TAG_CURRENT^)

          echo "TAG_CURRENT=$TAG_CURRENT" >> "$GITHUB_ENV"
          echo "TAG_PREVIOUS=$TAG_PREVIOUS" >> "$GITHUB_ENV"

          echo "CHANGELOG_MESSAGE<<EOF" >> $GITHUB_ENV
          sed -nzE "s/^.*## $TAG_CURRENT([^#]*).*$/\1/p" CHANGELOG.md  | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build
        run: |
          set -x
          git submodule init
          git submodule update

          sbt stage

          cd target/universal/stage
          tar -czvf ../../../"s3-dedup-proxy.tar.gz" bin lib --owner=0 --group=0

      - name: Create Release # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.TAG_CURRENT }}
          body: |
            ${{ env.CHANGELOG_MESSAGE }}

            Full changelog: [${{ env.TAG_PREVIOUS }}...${{ env.TAG_CURRENT }}](https://github.com/timshel/s3-dedup-proxy/compare/${{ env.TAG_PREVIOUS }}...${{ env.TAG_CURRENT }})

            :robot: Built by [release.yml](.github/workflows/release.yml) :robot:
          files: s3-dedup-proxy.tar.gz
          draft: false
          prerelease: false

  docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    environment: main
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    needs: build
    steps:
      - name: Check out the repo # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to Docker Hub # https://github.com/docker/login-action
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker # https://github.com/docker/metadata-action
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: timshel/s3-dedup-proxy

      - name: Build and push Docker image # https://github.com/docker/build-push-action
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: push
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
